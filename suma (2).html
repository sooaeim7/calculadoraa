<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma de dos números</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            width: 100%;
            max-width: 380px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 1.6rem;
        }
        label {
            display: block;
            text-align: left;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        #resultado {
            margin-top: 25px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #333;
            min-height: 30px;
        }
        .error {
            color: #e74c3c !important;
            font-size: 1rem !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Suma de dos números</h1>
        
        <label for="num1">Primer número</label>
        <input type="number" id="num1" placeholder="Ingresá el primer número" step="any">
        
        <label for="num2">Segundo número</label>
        <input type="number" id="num2" placeholder="Ingresá el segundo número" step="any">
        
        <button onclick="sumar()">Sumar</button>
        
        <div id="resultado"></div>
    </div>

    <script>
        function sumar() {
            const n1 = parseFloat(document.getElementById("num1").value);
            const n2 = parseFloat(document.getElementById("num2").value);
            const resultado = document.getElementById("resultado");
            
            if (isNaN(n1) || isNaN(n2)) {
                resultado.innerHTML = "Por favor, ingresá dos números válidos.";
                resultado.className = "error";
                return;
            }
            
            const suma = n1 + n2;
            resultado.innerHTML = "Resultado: " + suma;
            resultado.className = "";
        }

        // También suma al presionar Enter
        document.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                sumar();
            }
        });
    </script>
</body>
</html>
